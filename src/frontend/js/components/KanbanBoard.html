<script>
/**
 * KanbanBoard.js
 * カンバンボードコンポーネント
 */
const KanbanBoard = (() => {
  let _tasks = [];
  let _users = {};
  let _categories = {};

  function init(tasks, users, categories) {
    setData(tasks, users, categories);
    render();
  }

  function setData(tasks, users, categories) {
    _tasks = tasks || [];
    _users = {};
    (users || []).forEach(u => { _users[u.userId] = u; });
    _categories = {};
    (categories || []).forEach(c => { _categories[c.categoryId] = c; });
  }

  function setTasks(tasks) {
    _tasks = tasks || [];
    render();
  }

  function render() {
    const sortByDueDate = (a, b) => {
      // 期日なしは後ろに回す
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    };

    const notStarted = _tasks.filter(t => t.status === '未着手').sort(sortByDueDate);
    const inProgress = _tasks.filter(t => t.status === '進行中').sort(sortByDueDate);
    const completed = _tasks.filter(t => t.status === '完了')
      .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
      .slice(0, 10);

    renderColumn('list-not-started', notStarted);
    renderColumn('list-in-progress', inProgress);
    renderColumn('list-completed', completed);

    DomHelper.$('#count-not-started').textContent = notStarted.length;
    DomHelper.$('#count-in-progress').textContent = inProgress.length;
    DomHelper.$('#count-completed').textContent = completed.length;

    DragDrop.refreshListeners();
  }

  function renderColumn(containerId, tasks) {
    const container = DomHelper.$('#' + containerId);
    if (!container) return;
    DomHelper.renderList(container, tasks, createTaskCard);
  }

  function createTaskCard(task) {
    const category = _categories[task.categoryId];
    const isOverdue = task.status !== '完了' && DomHelper.isOverdue(task.dueDate);
    const isDueToday = task.status !== '完了' && DomHelper.isToday(task.dueDate);

    const metaItems = [];

    // 期限
    if (task.dueDate) {
      const dueCls = isOverdue ? 'task-card-due overdue' : isDueToday ? 'task-card-due today' : 'task-card-due';
      const dueText = task.dueTime
        ? `${DomHelper.formatDate(task.dueDate)} ${task.dueTime}`
        : DomHelper.formatDate(task.dueDate);
      metaItems.push(
        DomHelper.createElement('span', { className: dueCls }, dueText)
      );
    }

    // 担当者（複数対応）
    const assigneeIds = (task.assigneeId || '').split(',').filter(v => v);
    if (assigneeIds.includes('__ALL__')) {
      metaItems.push(
        DomHelper.createElement('span', { className: 'task-card-assignee' }, '全員')
      );
    } else if (assigneeIds.length > 0) {
      const names = assigneeIds.map(id => {
        const u = _users[id];
        return u ? u.displayName : '';
      }).filter(n => n);
      if (names.length > 0) {
        metaItems.push(
          DomHelper.createElement('span', { className: 'task-card-assignee' }, names.join(', '))
        );
      }
    }

    // カテゴリ
    if (category) {
      metaItems.push(
        DomHelper.createElement('span', {
          className: 'task-card-category',
          style: { backgroundColor: category.color || '#4a86c8' },
        }, category.name)
      );
    }

    const titleCls = isOverdue ? 'task-card-title overdue' : isDueToday ? 'task-card-title today' : 'task-card-title';

    const card = DomHelper.createElement('div', {
      className: 'task-card',
      draggable: 'true',
      dataset: { taskId: task.taskId, priority: String(task.priority || 2) },
    }, [
      DomHelper.createElement('div', { className: titleCls }, DomHelper.escapeHtml(task.title)),
      DomHelper.createElement('div', { className: 'task-card-meta' }, metaItems),
    ]);

    return card;
  }

  function getTaskById(taskId) {
    return _tasks.find(t => t.taskId === taskId);
  }

  function updateTaskInList(updatedTask) {
    const idx = _tasks.findIndex(t => t.taskId === updatedTask.taskId);
    if (idx !== -1) {
      _tasks[idx] = updatedTask;
    }
    render();
  }

  function removeTaskFromList(taskId) {
    _tasks = _tasks.filter(t => t.taskId !== taskId);
    render();
  }

  function addTaskToList(task) {
    _tasks.push(task);
    render();
  }

  function getTasks() {
    return _tasks;
  }

  return {
    init,
    setData,
    setTasks,
    render,
    getTaskById,
    updateTaskInList,
    removeTaskFromList,
    addTaskToList,
    getTasks,
  };
})();
</script>
