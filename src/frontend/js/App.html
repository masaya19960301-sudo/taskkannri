<script>
/**
 * App.js
 * アプリケーションのメインコントローラー
 */
const App = (() => {
  let _currentUser = null;
  let _users = [];
  let _categories = [];
  let _showCompleted = false;

  /**
   * アプリケーション初期化
   */
  function init() {
    ApiClient.getInitialData()
      .then(data => {
        _currentUser = data.currentUser;
        _users = data.users || [];
        _categories = data.categories || [];

        // CSRFトークンの設定
        ApiClient.setCsrfToken(data.csrfToken);

        // 初回登録チェック
        if (!_currentUser.displayName || _currentUser.displayName === _currentUser.email.split('@')[0]) {
          showRegisterDialog();
        }

        // コンポーネント初期化
        Clock.init();
        TaskForm.init(_currentUser);
        TaskForm.populateSelects(_users, _categories);
        TaskDetail.init(_users, _categories);
        KanbanBoard.init(data.tasks || [], _users, _categories);
        Settings.init(_currentUser, _categories);

        // ユーザー名表示
        DomHelper.$('#user-name').textContent = _currentUser.displayName || _currentUser.email;

        // D&D 初期化
        DragDrop.init(handleDrop);

        // イベントリスナーの設定
        setupEventListeners();

        // UIの表示
        hideLoading();
        DomHelper.show('#app-header');
        DomHelper.show('#main-content');
      })
      .catch(err => {
        console.error('初期化エラー:', err);
        DomHelper.$('#loading-screen').innerHTML =
          '<p style="color:#d93025;">読み込みエラー: ' + DomHelper.escapeHtml(err.message || String(err)) + '</p>' +
          '<button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;">再読み込み</button>';
      });
  }

  /**
   * イベントリスナーの設定（イベントデリゲーション）
   */
  function setupEventListeners() {
    // タブ切り替え
    DomHelper.delegate('.tab-nav', 'click', '.tab-btn', (e, target) => {
      const tab = target.dataset.tab;
      if (tab) switchTab(tab);
    });

    // カンバンカードクリック → 詳細モーダル
    DomHelper.delegate('#tab-kanban', 'click', '.task-card', (e, target) => {
      // ドラッグ操作中はモーダルを開かない
      if (target.classList.contains('dragging')) return;
      const taskId = target.dataset.taskId;
      if (taskId) TaskDetail.open(taskId);
    });

    // フィルター変更
    ['#filter-assignee', '#filter-category', '#filter-priority'].forEach(sel => {
      const el = DomHelper.$(sel);
      if (el) el.addEventListener('change', handleFilterChange);
    });

    // キーワード検索（debounce）
    let searchTimer = null;
    const keywordInput = DomHelper.$('#filter-keyword');
    if (keywordInput) {
      keywordInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(handleFilterChange, 300);
      });
    }

    // 完了タスクトグル
    const btnToggle = DomHelper.$('#btn-toggle-completed');
    if (btnToggle) {
      btnToggle.addEventListener('click', handleToggleCompleted);
    }
  }

  /**
   * タブ切り替え
   */
  function switchTab(tabName) {
    DomHelper.$$('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    DomHelper.$$('.tab-content').forEach(content => {
      content.classList.toggle('active', content.id === 'tab-' + tabName);
    });
  }

  /**
   * フィルター適用
   */
  function handleFilterChange() {
    const filters = {
      assigneeId: DomHelper.$('#filter-assignee').value,
      categoryId: DomHelper.$('#filter-category').value,
      priority: DomHelper.$('#filter-priority').value,
      keyword: DomHelper.$('#filter-keyword').value,
    };

    if (_showCompleted) {
      filters.includeCompleted = 'true';
    }

    // 空値を除去
    Object.keys(filters).forEach(key => {
      if (!filters[key]) delete filters[key];
    });

    ApiClient.get('/tasks', filters)
      .then(response => {
        KanbanBoard.setTasks(response.data.tasks || []);
      })
      .catch(err => {
        Toast.show('タスクの取得に失敗しました', 'error');
      });
  }

  /**
   * 完了タスク表示/非表示トグル
   */
  function handleToggleCompleted() {
    _showCompleted = !_showCompleted;
    const btn = DomHelper.$('#btn-toggle-completed');
    if (_showCompleted) {
      btn.textContent = '完了タスクを非表示';
      btn.classList.add('active');
    } else {
      btn.textContent = '完了タスクを表示';
      btn.classList.remove('active');
    }
    handleFilterChange();
  }

  /**
   * D&D ドロップハンドラ
   */
  function handleDrop(taskId, newStatus, newIndex, cards) {
    // ステータス更新
    const task = KanbanBoard.getTaskById(taskId);
    if (!task) return;

    const statusChanged = task.status !== newStatus;

    // sortOrder の計算
    const orders = cards.map((card, i) => ({
      taskId: card.dataset.taskId,
      sortOrder: i * 10,
    }));

    // 楽観的UI更新
    if (statusChanged) {
      task.status = newStatus;
    }

    // API呼び出し（ロック競合を防ぐため直列実行）
    let chain = Promise.resolve();

    if (statusChanged) {
      chain = chain.then(() =>
        ApiClient.put('/tasks/' + taskId, { status: newStatus })
          .then(response => {
            KanbanBoard.updateTaskInList(response.data);
          })
      );
    }

    if (orders.length > 0) {
      chain = chain.then(() =>
        ApiClient.post('/tasks/' + taskId + '/sort', { orders })
      );
    }

    chain.catch(err => {
      Toast.show('更新に失敗しました。再読み込みしてください。', 'error');
      handleFilterChange(); // データ再取得
    });
  }

  /**
   * 初回登録ダイアログ
   */
  function showRegisterDialog() {
    DomHelper.show('#register-dialog');
    DomHelper.$('#reg-displayName').value = _currentUser.displayName || '';

    DomHelper.$('#register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = DomHelper.$('#reg-displayName').value.trim();
      if (!name) {
        Toast.show('表示名を入力してください', 'error');
        return;
      }

      ApiClient.post('/auth/register', {
        displayName: name,
        department: DomHelper.$('#reg-department').value.trim(),
      })
        .then(response => {
          _currentUser = response.data;
          DomHelper.$('#user-name').textContent = _currentUser.displayName;
          DomHelper.hide('#register-dialog');
          Toast.show('登録が完了しました', 'success');
        })
        .catch(err => {
          Toast.show(err.message || '登録に失敗しました', 'error');
        });
    });
  }

  /**
   * ローディング画面を非表示
   */
  function hideLoading() {
    DomHelper.hide('#loading-screen');
  }

  return {
    init,
    switchTab,
  };
})();

// アプリケーション起動
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
