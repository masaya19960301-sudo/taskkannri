<style>
/* ========================================
   CSS Reset & Variables
   ======================================== */
:root {
  --color-primary: #1a73e8;
  --color-primary-dark: #1557b0;
  --color-danger: #d93025;
  --color-danger-dark: #b3261e;
  --color-success: #1e8e3e;
  --color-warning: #f9ab00;
  --color-bg: #f8f9fa;
  --color-surface: #ffffff;
  --color-border: #dadce0;
  --color-text: #202124;
  --color-text-secondary: #5f6368;
  --color-hover: #f1f3f4;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.15);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.2);
  --radius: 8px;
  --radius-sm: 4px;
  --transition: 0.2s ease;
  --kanban-not-started: #e8f0fe;
  --kanban-in-progress: #fef7e0;
  --kanban-completed: #e6f4ea;
  --priority-high: #d93025;
  --priority-medium: #f9ab00;
  --priority-low: #1e8e3e;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}

/* ========================================
   Loading Screen
   ======================================== */
.loading-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--color-bg);
  z-index: 9999;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--color-border);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========================================
   Header
   ======================================== */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--color-primary);
}

.tab-nav {
  display: flex;
  gap: 4px;
}

.tab-btn {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all var(--transition);
}

.tab-btn:hover {
  background: var(--color-hover);
}

.tab-btn.active {
  background: var(--color-primary);
  color: white;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.clock-widget {
  font-size: 13px;
  color: var(--color-text-secondary);
  font-variant-numeric: tabular-nums;
}

.user-info {
  font-size: 13px;
  color: var(--color-text-secondary);
}

/* ========================================
   Filter Bar
   ======================================== */
.filter-bar {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 12px 24px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.filter-group label {
  font-size: 11px;
  color: var(--color-text-secondary);
  font-weight: 500;
  text-transform: uppercase;
}

.filter-select, .filter-input {
  padding: 6px 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  min-width: 120px;
  background: white;
}

.filter-select:focus, .filter-input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
}

/* ========================================
   Tab Content
   ======================================== */
.tab-content {
  display: none;
  padding: 16px 24px;
}

.tab-content.active {
  display: block;
}

/* ========================================
   Kanban Board
   ======================================== */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  min-height: calc(100vh - 180px);
}

.kanban-column {
  background: var(--color-bg);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  min-height: 200px;
}

.kanban-column[data-status="未着手"] { background: var(--kanban-not-started); }
.kanban-column[data-status="進行中"] { background: var(--kanban-in-progress); }
.kanban-column[data-status="完了"] { background: var(--kanban-completed); }

.kanban-column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border);
}

.kanban-column-header h3 {
  font-size: 14px;
  font-weight: 600;
}

.kanban-count {
  background: rgba(0,0,0,0.1);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.kanban-list {
  flex: 1;
  padding: 8px;
  overflow-y: auto;
  min-height: 100px;
}

.kanban-list.drag-over {
  background: rgba(26,115,232,0.1);
  border: 2px dashed var(--color-primary);
}

/* ========================================
   Task Card
   ======================================== */
.task-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
  border-left: 4px solid transparent;
  position: relative;
}

.task-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.task-card.dragging {
  opacity: 0.5;
  transform: rotate(2deg);
}

.task-card[data-priority="3"] { border-left-color: var(--priority-high); }
.task-card[data-priority="2"] { border-left-color: var(--priority-medium); }
.task-card[data-priority="1"] { border-left-color: var(--priority-low); }

.task-card-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
  word-break: break-word;
}

.task-card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--color-text-secondary);
  flex-wrap: wrap;
}

.task-card-due {
  display: flex;
  align-items: center;
  gap: 2px;
}

.task-card-due.overdue {
  color: var(--color-danger);
  font-weight: 600;
}

.task-card-assignee {
  background: var(--color-hover);
  padding: 1px 6px;
  border-radius: 3px;
}

.task-card-category {
  padding: 1px 6px;
  border-radius: 3px;
  color: white;
  font-size: 10px;
  font-weight: 600;
}

/* ========================================
   Buttons
   ======================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  gap: 6px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--color-primary);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn-secondary {
  background: var(--color-hover);
  color: var(--color-text);
  border: 1px solid var(--color-border);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--color-border);
}

.btn-danger {
  background: var(--color-danger);
  color: white;
}

.btn-danger:hover:not(:disabled) {
  background: var(--color-danger-dark);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
}

.btn-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--color-text-secondary);
  padding: 4px 8px;
  line-height: 1;
}

.btn-close:hover {
  color: var(--color-text);
}

/* ========================================
   Forms
   ======================================== */
.form-container {
  max-width: 800px;
  margin: 0 auto;
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}

.form-container h2 {
  margin-bottom: 20px;
  font-size: 18px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 4px;
  color: var(--color-text-secondary);
}

.form-group input[type="text"],
.form-group input[type="date"],
.form-group input[type="time"],
.form-group input[type="number"],
.form-group input[type="email"],
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  transition: border-color var(--transition);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
}

.form-row {
  display: flex;
  gap: 16px;
}

.flex-1 { flex: 1; }
.flex-2 { flex: 2; }

.form-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.required {
  color: var(--color-danger);
}

.weekday-checkboxes {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.weekday-checkboxes label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
}

.inline-form {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}

.inline-form input[type="text"] {
  padding: 6px 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
}

/* ========================================
   Dialog / Modal
   ======================================== */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.dialog {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 480px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
}

.dialog-large {
  max-width: 700px;
}

.dialog h2 {
  font-size: 18px;
  margin-bottom: 16px;
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.dialog-header h2 {
  margin-bottom: 0;
}

.dialog-body {
  margin-bottom: 20px;
}

.dialog-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding-top: 16px;
  border-top: 1px solid var(--color-border);
}

/* ========================================
   Detail Grid
   ======================================== */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.detail-item label {
  display: block;
  font-size: 11px;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.detail-description {
  margin-bottom: 16px;
}

.detail-description label {
  display: block;
  font-size: 11px;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.detail-description p {
  background: var(--color-bg);
  padding: 12px;
  border-radius: var(--radius-sm);
  white-space: pre-wrap;
  min-height: 40px;
}

/* ========================================
   Badges
   ======================================== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.badge-not-started { background: #e8f0fe; color: #1967d2; }
.badge-in-progress { background: #fef7e0; color: #e37400; }
.badge-completed { background: #e6f4ea; color: #137333; }
.badge-priority-high { background: #fce8e6; color: #c5221f; }
.badge-priority-medium { background: #fef7e0; color: #e37400; }
.badge-priority-low { background: #e6f4ea; color: #137333; }

/* ========================================
   Attachments
   ======================================== */
.detail-attachments {
  margin-bottom: 16px;
}

.detail-attachments > label {
  display: block;
  font-size: 11px;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.attachment-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
}

.attachment-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: var(--color-bg);
  border-radius: var(--radius-sm);
  font-size: 13px;
}

.attachment-item-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.attachment-item-size {
  color: var(--color-text-secondary);
  font-size: 11px;
}

/* ========================================
   Log List
   ======================================== */
.detail-logs > label {
  display: block;
  font-size: 11px;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.log-list {
  max-height: 200px;
  overflow-y: auto;
}

.log-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--color-bg);
}

.log-item-time {
  color: var(--color-text-secondary);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.log-item-action {
  font-weight: 500;
}

/* ========================================
   Settings
   ======================================== */
.settings-container {
  max-width: 800px;
  margin: 0 auto;
}

.settings-section {
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.settings-section h2 {
  font-size: 18px;
  margin-bottom: 16px;
}

.settings-section h3 {
  font-size: 15px;
  margin: 20px 0 12px;
  color: var(--color-text-secondary);
}

.category-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.category-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: var(--color-bg);
  border-radius: var(--radius-sm);
}

.category-item-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.category-color-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.admin-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

/* ========================================
   Toast Notifications
   ======================================== */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  padding: 12px 20px;
  border-radius: var(--radius);
  color: white;
  font-size: 14px;
  box-shadow: var(--shadow-md);
  animation: slideIn 0.3s ease;
  max-width: 400px;
  word-break: break-word;
}

.toast-success { background: var(--color-success); }
.toast-error { background: var(--color-danger); }
.toast-warning { background: var(--color-warning); color: var(--color-text); }
.toast-info { background: var(--color-primary); }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(100%); opacity: 0; }
}

.toast.removing {
  animation: slideOut 0.3s ease forwards;
}

/* ========================================
   Responsive
   ======================================== */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    height: auto;
    padding: 8px 16px;
    gap: 8px;
  }

  .kanban-board {
    grid-template-columns: 1fr;
  }

  .form-row {
    flex-direction: column;
  }

  .filter-bar {
    padding: 8px 16px;
  }

  .detail-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .dialog-large {
    width: 95%;
  }
}
</style>
